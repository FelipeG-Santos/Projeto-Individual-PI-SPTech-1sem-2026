<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diário de um Banana | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <img class="irmaozinho" src="../public/assets/imgs/irmaozinho-png.png" alt="">
      <h1 class="titulo"><span class="diario-header">Diário</span> de um Banana</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="simulador.html">Simulador</a>
        </li>
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <!--PÁGINA DE CADASTRO----------------------------------------------------------------------------------------------->
  <div class="cadastro">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>

    <!--ETAPA 1----------------------------------------------------------------------------------------------->
    <div class="container">
      <div class="card card_cadastro">

        <h2 id="titulo_formulario">Bem-vindo!</h2>
        <div class="formulario" id="etapa1">


          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>

        </div>

        <div id="div_erros_login"></div>


<!--ETAPA 2----------------------------------------------------------------------------------------------->
        <div class="formulario" id="etapa2" style="display: none;">

          <div class="campo">
            <span>Estado que você mora:</span>
            <input id="estado_input" type="text" placeholder="somente a sigla, ex: SP" />
          </div>
          <div class="campo">
            <span>Cidade:</span>
            <input id="cidade_input" type="text" placeholder="cidade" />
          </div>
          <div class="campo">
            <span>Bairro:</span>
            <input id="bairro_input" type="text" placeholder="bairro" />
          </div>


        </div>
        <button class="botao" id="botao_etapa" onclick="proximaEtapa()">Continuar</button>

        <div id="div_erros_login"></div>
      </div>
    </div>

  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>Feito por Felipe Santos, aluno SPTech-CCO 2026</h4>

    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>


  let etapaAtual_botao = 1;
  function proximaEtapa() {

    let nomeVar = nome_input.value;
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;
    let confirmacaoSenhaVar = confirmacao_senha_input.value;

    let indice_arroba = emailVar.indexOf("@");
    let indice_com = emailVar.indexOf(".com");

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {

      //Mensagem de erro pois está vazio:
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";

      // imterrompe a função, impedindo o cadastro:
      /* return false: para a função inteira
      break: para somente o loop */
      return false;

    } else if (indice_arroba == -1 || indice_com == -1) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para email errado)";

      return false;

    } else if (senhaVar.length < 6) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para senha curta)";

      return false;

    } else if (senhaVar != confirmacaoSenhaVar) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para senha incorreta)";

      return false;

    } else {
      //Se todos os campos estiverem preenchidos, sumir com a mensagem de erro:
      setTimeout(sumirMensagem, 1000);


      if (etapaAtual_botao === 1) {

        console.log("CHEGUEI AQUI");

        etapa1.style.display = "none";
        etapa2.style.display = "block";

        titulo_formulario.innerHTML = "Está quase lá!";

        botao_etapa.innerHTML = "Cadastrar"

        etapaAtual_botao = 2;

      } else {
        cadastrar()
      }
    }
  }


  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    let estadoVar = estado_input.value;
    let cidadeVar = cidade_input.value;
    let bairroVar = bairro_input.value;


    // Verificando se há algum campo em branco
    if (estadoVar == "" || cidadeVar == "" || bairroVar == "") {

      //Mensagem de erro pois está vazio:
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";

      // imterrompe a função, impedindo o cadastro:
      return false;
    } else if (estadoVar.length > 2) {

      console.log("chegou aqui");
      
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Mensagem de erro para estado muito grande)";

      return false;

    } else {
      //Se todos os campos estiverem preenchidos, sumir com a mensagem de erro:
      setTimeout(sumirMensagem, 5000);
    }


    // Enviando o valor da nova input
    //rota:
    fetch("/usuarios/cadastrar", {
      //POST: enviar dados para salvar
      method: "POST",
      //cabeçalho
      headers: {
        "Content-Type": "application/json",
      },
      //transforma em json
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,

        estadoServer: estadoVar,
        cidadeServer: cidadeVar,
        bairroServer: bairroVar
        
      }),
    })

      //executa quando a API responde
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        //Caso a resposta esteja ok:
        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
          //espera 2 segundos e redireciona para a tela de login
          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })

      //Resposta caso ocorra um erro na API:
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>
