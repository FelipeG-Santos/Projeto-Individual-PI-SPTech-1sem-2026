<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <span>CRUD da Dona Matilde (Reforço)</span><br>

    <br><span>Cadastrar antiguidade:</span>
    <input type="text" id="item">
    <button onclick="Cadastrar()">Cadastrar</button><br>

    <br><button onclick="Verificar()">Verificar Estoque</button><br>

    <br><span>Procure por antiguidades:</span>
    <input type="text" id="procura_item"><br>

    <br><button onclick="Pesquisar()">Pesquisar</button><br>

    <br><span>Insira o item que deseja alterar o nome:</span>
    <input type="text" id="nome_atual"><br>

    <br><span>Insira o novo nome:</span>
    <input type="text" id="nome_novo"><br>

    <button onclick="Alterar()">Alterar Nome</button>

    <br><span>Remover antiguidade:</span>
    <input type="text" id="remover_item"><br>

    <button onclick="Remover()">Remover Item</button><br>

    <br><button onclick="duplicados()">Itens duplicador</button>
    <div id="mensagem"></div>

</body>
<script>
    antiguidades = []

    function Cadastrar() {

        antiguidades.push(item.value);

        console.log(`${antiguidades}`);

    }

    function Verificar() {
        let texto = "";

        qtd_item = antiguidades.length

        if (qtd_item < 3) {
            texto += "A loja está quase vazia, precisamos de mais peças raras!"
        } else if (qtd_item <= 7) {
            texto += "Temos algumas peças, mas ainda podemos melhorar o acervo"
        } else if (qtd_item <= 10) {
            texto += "Ótimo! A loja já está bem interessante para os clientes"
        } else {
            texto += "Excelente! Nossa loja está cheia de relíquias incríveis!"
        }

        mensagem.innerHTML = `${texto}`
    }

    function Pesquisar() {
        let texto = "";
        let unidades = 0;

        for (let i = 0; i < antiguidades.length; i++) {
            if (antiguidades[i] == procura_item.value) {
                unidades++

            } else {
                texto = `Não encontramos o item ${procura_item.value}, talvez seja hora de procurar essa raridade!`
            }
        }

        if (unidades > 0) {
            texto = `Temos o item ${procura_item.value} e há ${unidades} unidade(s) dele na loja`
        }

        mensagem.innerHTML = `${texto}`
    }

    function Alterar() {
        let texto = "";

        for (let i = 0; i < antiguidades.length; i++) {
            if (antiguidades[i] == nome_atual.value) {

                antiguidades[i] = nome_novo.value;

            } else {
                texto = `O item '${nome_atual.value}' não foi encontrado na loja`
            }
        }

        for (let i = 0; i < antiguidades.length; i++) {
            if (antiguidades[i] == nome_novo.value) {
                texto = `O item '${nome_atual.value}' foi atualizado para '${nome_novo.value}`
            }
        }

        console.log(`${antiguidades}`);
        mensagem.innerHTML = `${texto}`
    }

    function Remover() {
        let texto = "";
        let contador = 0;

        for (let i = 0; i < antiguidades.length; i++) {
            if (antiguidades[i] == remover_item.value) {
                antiguidades.splice(i, 1);
                i--;
                contador++
            }
        }

        if (contador > 0) {
            texto = `O item '${remover_item.value}' foi removido do estoque`
        } else {
            texto = `O item '${remover_item.value}' não está no estoque`
        }
        console.log(`${antiguidades}`);

        mensagem.innerHTML = `${texto}`

    }

    function duplicados() {
        let texto = "";
        let vetor_auxiliar = [];

        for (let i = 0; i < antiguidades.length; i++) {
            let contador = 0;

            for (let h = 0; h < antiguidades.length; h++) {
                if (antiguidades[i] == antiguidades[h]) {
                    contador++
                }
            }

            if (vetor_auxiliar.includes(antiguidades[i])) {
                texto += ""
            } else {
                if(contador > 1){
                texto += `-> ${antiguidades[i]} (${contador} unidades)`;
                vetor_auxiliar.push(antiguidades[i])
                } 
            }
        }

        mensagem.innerHTML = texto;
    }
</script>

</html>
