<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/estilo.css">
    <title>Meus Livros</title>
</head>

<body>

    <h1>Meus Livros "Diário de um Banana"</h1><br>

    <div class="formulario" id="etapa1">


        <div class="campo">
            <span>Nome do livro:</span>
            <input type="text" id="ipt_nome_livro" placeholder="digite o nome do livro">
        </div>
        <div class="campo">
            <br><span>Nota do livro:</span>
            <input type="number" id="ipt_nota_livro" placeholder="digite a nota de 1 a 5">
        </div>
        <div class="campo">
            <br><span>Descrição:</span>
            <input type="text" id="ipt_descricao" placeholder="descrição da sua avaliação">
        </div>

    </div>





    <button class="botao" onclick="Cadastrar()">Cadastrar</button><br>


    <br><span>Procure pelos seus livros cadastrados:</span>
    <input type="text" id="ipt_procura_livro"><br>
    <button onclick="Procurar()">Procurar</button><br>


    <br><span>Remover livro:</span>
    <input type="text" id="ipt_remover_livro"><br>

    <button onclick="Remover()">Remover</button><br>


</body>
<script>
    livros = []

    var procura_livro = ipt_procura_livro.value;
    var remover_livro = ipt_remover_livro.value;

    function Cadastrar() {

        // Agora vá para o método fetch logo abaixo
        var nome_livroVar = ipt_nome_livro.value;
        var nota_livroVar = ipt_nota_livro.value;
        var descricaoVar = ipt_descricao.value;

// Enviando o valor da nova input
    //rota:
    fetch("/livros/cadastrar", {
      //POST: enviar dados para salvar
      method: "POST",
      //cabeçalho
      headers: {
        "Content-Type": "application/json",
      },
      //transforma em json
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nome_livroServer: nome_livroVar,
        nota_livroServer: nota_livroVar,
        descricaoServer: descricaoVar,
        fk_usuarioServer: sessionStorage.ID_USUARIO
        
      }),
      
    })

      //executa quando a API responde
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        //Caso a resposta esteja ok:
        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Livro cadastrado com sucesso";
         
          
          limparFormulario();
          
        } else {
          throw "Houve um erro ao tentar cadastrar o livro!";
        }
      })

      //Resposta caso ocorra um erro na API:
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }


    








    function Procurar() {
        let texto = "";
        let unidades = 0;

        for (let i = 0; i < livros.length; i++) {
            if (livros[i] == procura_livro.value) {
                unidades++

            } else {
                texto = `Não encontramos o item ${procura_livro.value}!`
            }
        }

        if (unidades > 0) {
            texto = `Temos o item ${procura_livro.value} e há ${unidades} unidade(s) dele`
        }

        mensagem.innerHTML = `${texto}`
    }

    function Remover() {
        let texto = "";
        let contador = 0;

        for (let i = 0; i < livros.length; i++) {
            if (livros[i] == remover_livro.value) {
                livros.splice(i, 1);
                i--;
                contador++
            }
        }

        if (contador > 0) {
            texto = `O item '${remover_livro.value}' foi removido do estoque`
        } else {
            texto = `O item '${remover_livro.value}' não está no estoque`
        }
        console.log(`${livros}`);

        mensagem.innerHTML = `${texto}`

    }
</script>

</html>
